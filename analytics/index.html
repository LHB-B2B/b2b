<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B2B Analytics · LHB</title>
<link rel="icon" type="image/png" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" async onload="window.__chartReady && window.__chartReady()"></script>
<style>
  /* Analytics for lhb-b2b.github.io/b2b/ . The page holds no data: after a Google sign-in (email on the Admin tab of
     "B2B Website Access") it reads the "B2B Website Visits" sheet directly (shared "Anyone with the link"). */
  :root { --red: #C80000; --ink: #111827; --muted: #6B7280; --line: #E5E7EB; --bg: #F6F7F9; --card: #FFFFFF; --blue: #2563EB; --blue2: #93C5FD;
    --ok: #DCFCE7; --mid: #FEF3C7; --low: #FEE2E2; --none: #FECACA; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Figtree', -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button, select, input { font: inherit; }
  header { position: sticky; top: 0; z-index: 20; background: #0B0B0B; color: #fff; border-bottom: 3px solid var(--red); }
  .hd { max-width: 1400px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .brand img { width: 40px; height: 40px; background: #fff; padding: 4px; }
  .brand b { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
  .brand span { display: block; font-size: 12.5px; color: #94A3B8; font-weight: 500; }
  .seg { display: inline-flex; border: 1px solid rgba(255,255,255,0.18); }
  .seg button { appearance: none; border: 0; background: transparent; color: #CBD5E1; padding: 8px 12px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .seg button.on { background: var(--red); color: #fff; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: #CBD5E1; cursor: pointer; }
  .live { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: #E2E8F0; }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: #22C55E; box-shadow: 0 0 0 0 rgba(34,197,94,0.6); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  nav.tabs { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; gap: 4px; overflow-x: auto; }
  nav.tabs button { appearance: none; border: 0; background: transparent; color: #CBD5E1; padding: 10px 14px; font-weight: 700; font-size: 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -3px; white-space: nowrap; }
  nav.tabs button.on { color: #fff; border-color: #fff; }
  main { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .grid { display: grid; gap: 16px; }
  .g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 700px) { .g6 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g2, .g3 { grid-template-columns: 1fr; } main { padding: 14px; } }
  .card { background: var(--card); border: 1px solid var(--line); padding: 18px; min-width: 0; }
  .card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 800; }
  .card .sub { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
  .kpi .l { font-size: 13px; color: var(--muted); font-weight: 600; }
  .kpi .v { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; }
  .kpi .d { font-size: 12.5px; margin-top: 2px; color: var(--muted); }
  .up { color: #15803D; } .down { color: #B91C1C; }
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 13.5px; }
  .bar .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .c { font-weight: 700; text-align: right; }
  .bar .t { grid-column: 1 / -1; height: 6px; background: #EEF2F7; }
  .bar .t i { display: block; height: 100%; background: var(--blue); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 700; color: var(--muted); font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid #F1F2F4; vertical-align: top; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #F9FAFB; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .p-Active { background: var(--ok); color: #166534; } .p-Slowing { background: var(--mid); color: #92400E; } .p-Stopped { background: var(--low); color: #991B1B; } .p-Never { background: var(--none); color: #7F1D1D; }
  .kgrid td { text-align: center; font-weight: 700; padding: 8px 6px; border: 1px solid #fff; }
  .kgrid td.l { text-align: left; font-weight: 600; white-space: nowrap; }
  .heat { display: grid; grid-template-columns: 40px repeat(24, minmax(0, 1fr)); gap: 2px; font-size: 11.5px; color: var(--muted); }
  .heat i { aspect-ratio: 1; background: #EEF2F7; display: block; }
  .muted { color: var(--muted); }
  .empty { padding: 18px; text-align: center; color: var(--muted); font-size: 14px; }
  .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0B0B0B;
    background-image: radial-gradient(circle at 50% 40%, rgba(200,0,0,0.24) 0%, transparent 50%); color: #fff; padding: 20px; }
  .gate .box { width: min(420px, 100%); text-align: center; }
  .gate img { width: 72px; height: 72px; background: #fff; padding: 8px; }
  .gate h1 { font-size: 28px; margin: 16px 0 6px; } .gate p { color: #CBD5E1; line-height: 1.55; margin: 0 0 20px; }
  .gate .msg { color: #FCA5A5; min-height: 1.5em; margin-top: 12px; font-size: 14px; }
  #gbtn { display: flex; justify-content: center; }
  .drawer { position: fixed; inset: 0 0 0 auto; width: min(560px, 100%); background: #fff; z-index: 40; box-shadow: -20px 0 60px rgba(0,0,0,0.2); transform: translateX(100%); transition: transform 240ms cubic-bezier(0.16,1,0.3,1); overflow-y: auto; }
  .drawer.on { transform: none; }
  .drawer .dh { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--line); padding: 16px 18px; display: flex; align-items: center; gap: 12px; }
  .drawer .dh b { font-size: 18px; } .drawer .dh button { margin-left: auto; appearance: none; border: 0; background: transparent; font-size: 26px; cursor: pointer; color: var(--muted); }
  .drawer .db { padding: 16px 18px; }
  .tl { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 14px; }
  .tl .it { position: relative; padding: 6px 0; font-size: 13.5px; }
  .tl .it::before { content: ''; position: absolute; left: -20px; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
  .tl .it.vr::before { background: var(--red); } .tl .it.day { font-weight: 800; padding-top: 14px; } .tl .it.day::before { display: none; }
  .scrim { position: fixed; inset: 0; background: rgba(17,24,39,0.35); z-index: 35; display: none; } .scrim.on { display: block; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="box">
    <img src="../apple-touch-icon.png" alt="LafargeHolcim">
    <h1>B2B Analytics</h1>
    <p>Usage analytics for the B2B Sales LHB website. Sign in with a Google account on the Admin list.</p>
    <div id="gbtn"></div>
    <div class="msg" id="gmsg"></div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="hd">
      <div class="brand"><img src="../apple-touch-icon.png" alt=""><div><b>B2B Analytics</b><span id="updated">Loading…</span></div></div>
      <span class="live" id="live" title="People active in the last 15 minutes"><i></i><span>0 active now</span></span>
      <div class="seg" id="range">
        <button data-d="1">Today</button><button data-d="7" class="on">7 days</button><button data-d="30">30 days</button><button data-d="90">90 days</button>
      </div>
      <label class="chk"><input type="checkbox" id="hideMe" checked> Hide my own visits</label>
      <button type="button" id="signout" style="appearance:none;border:1px solid rgba(255,255,255,0.18);background:transparent;color:#CBD5E1;padding:8px 12px;font-weight:700;font-size:13.5px;cursor:pointer">Sign out</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-t="overview" class="on">Overview</button><button data-t="people">People</button><button data-t="content">Pages &amp; clicks</button>
      <button data-t="visit">Visit Report</button><button data-t="tech">Devices &amp; problems</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="dh"><b id="dname"></b><button type="button" id="dclose" aria-label="Close">×</button></div><div class="db" id="dbody"></div></aside>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function () {
  var CID = '1060235301123-ap4493jmtm6bn5j646esu3le9438jvu3.apps.googleusercontent.com';
  var TZ = 'Asia/Dhaka', DAY = 864e5;
  var S = { data: null, days: 7, tab: 'overview', hideMe: true, token: null, key: null, charts: {}, vf: { who: '', q: '' }, cf: '' };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var fmtN = function (n) { return Math.round(n).toLocaleString('en-US'); };
  var dkey = function (t) { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(t)); };
  var dfmt = function (t, o) { return new Intl.DateTimeFormat('en-GB', Object.assign({ timeZone: TZ }, o)).format(new Date(t)); };
  var when = function (t) { return dfmt(t, { day: 'numeric', month: 'short' }) + ', ' + dfmt(t, { hour: 'numeric', minute: '2-digit', hour12: true }); };
  var ago = function (t) { var m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago'; };
  var dur = function (s) { s = Math.round(s); return s < 60 ? s + ' s' : s < 3600 ? Math.floor(s / 60) + ' min ' + (s % 60 ? (s % 60) + ' s' : '') : (s / 3600).toFixed(1) + ' h'; };
  var hourOf = function (t) { return +dfmt(t, { hour: '2-digit', hour12: false }) % 24; };
  var dowOf = function (t) { return ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].indexOf(dfmt(t, { weekday: 'short' })); };
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var fmtMonth = function (m) { var x = String(m || '').match(/^(\d{4})-(\d{2})/); return x ? MON[+x[2] - 1] + ' ' + x[1] : String(m || ''); };
  var fmtDay = function (d) { var x = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return x ? (+x[3]) + ' ' + MON[+x[2] - 1] : String(d || ''); };
  var norm = function (t) { return String(t || '').toLowerCase().replace(/team/g, '').replace(/[^a-z]/g, ''); };

  // ------------------------------------------------------------- sign-in + data (v83: read straight from the sheets)
  // Fast like the main site: the dashboard reads the "B2B Website Visits" sheet (shared "Anyone with the link: Viewer")
  // through Google's query link (JSONP, in parallel), shows the last copy at once and refreshes in the background.
  // Who may open it = the Admin tab of "B2B Website Access"; the Google sign-in is remembered in this browser.
  var VIS = '11NdBkpzbJYjTVgzCyrelRKEmj72RMMTJni3Ea03bX0A', ACC = '1oQho1hZbnT6HMrhlfBibF0b5rFE3h1rVP_GKNz7EPuw', ADMIN_GID = 1544028266;
  var USER = 'lh-analytics-user', CACHE = 'lh-analytics-cache';
  var store = { get: function (k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del: function (k) { try { localStorage.removeItem(k); } catch (e) {} } };
  var n = 0;
  function gv(id, params) {
    return new Promise(function (ok, bad) {
      var cb = '__an' + (++n) + Date.now().toString(36), sc = document.createElement('script');
      var end = function () { clearTimeout(tm); try { delete window[cb]; } catch (e) {} sc.remove(); };
      var tm = setTimeout(function () { end(); bad(new Error('timeout')); }, 20000);
      window[cb] = function (r) { end(); if (r && r.status === 'ok') ok(r); else bad(new Error((r && r.errors && r.errors[0] && r.errors[0].detailed_message) || 'error')); };
      sc.onerror = function () { end(); bad(new Error('blocked')); };
      sc.src = 'https://docs.google.com/spreadsheets/d/' + id + '/gviz/tq?' + params + '&tqx=responseHandler:' + cb;
      document.head.appendChild(sc);
    });
  }
  // gviz cell -> value; sheet times are Dhaka wall clock ("Date(2026,9,7,22,27,12)") -> epoch ms
  function val(c) {
    if (!c || c.v == null) return '';
    if (typeof c.v === 'string' && /^Date\(/.test(c.v)) { var p = c.v.match(/\d+/g).map(Number); return Date.UTC(p[0], p[1], p[2] || 1, p[3] || 0, p[4] || 0, p[5] || 0) - 6 * 3600e3; }
    return c.v;
  }
  var rowsOf = function (t) { return t.table.rows.map(function (r) { return (r.c || []).map(val); }); };
  var lower = function (rs) { rs.forEach(function (r) { r[1] = String(r[1] || '').trim().toLowerCase(); }); return rs; };
  function listOf(t) { var m = {}; rowsOf(t).forEach(function (x) { var e = String(x[0] || '').trim().toLowerCase(); if (e.indexOf('@') > 0) m[e] = { n: String(x[1] || ''), r: String(x[2] || ''), team: String(x[3] || '') }; }); return m; }
  var admins = function () { return gv(ACC, 'gid=' + ADMIN_GID + '&headers=1&range=A3:C500').then(listOf); };
  function fetchAll(me) {
    var from = new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date(Date.now() - 90 * DAY));
    var q = function (sheet, cols) { return gv(VIS, 'sheet=' + encodeURIComponent(sheet) + '&headers=1&tq=' + encodeURIComponent('select ' + cols + " where A >= datetime '" + from + " 00:00:00'")).then(rowsOf).then(lower); };
    return Promise.all([
      q('Visits', 'A,C,E,F,G,H,I,J'),         // t, email, device, system, browser, screen, first page, visit id
      q('Pages', 'A,C,D,E,F,G'),              // t, email, page, visit id, seconds, scroll
      q('Visit Report', 'A,C,D,E,F,G,H,I'),   // t, email, report tab, month, salesperson, day, what, seconds
      q('Events', 'A,C,D,E,F,G,H,I,K'),       // t, email, type, page, label, detail, x, y, seconds
      gv(ACC, 'gid=0&headers=1&range=A3:D2000').then(listOf)
    ]).then(function (x) { return { now: Date.now(), admin: me.e, visits: x[0], pages: x[1], vr: x[2], events: x[3], people: x[4] }; });
  }
  function show(d, cached) {
    S.data = d; $('gate').hidden = true; $('app').hidden = false; render();
    if (cached) $('updated').textContent = 'Showing the last copy (' + ago(d.now) + ') · updating…';
  }
  function load(quiet) {
    var me = store.get(USER); if (!me) return showGate();
    if (!quiet && !S.data) $('updated').textContent = 'Loading…';
    return Promise.all([admins(), fetchAll(me)]).then(function (x) {
      if (!x[0][me.e]) { store.del(USER); store.del(CACHE); S.data = null; return showGate(me.e + ' is not on the Admin list.'); }
      show(x[1]); store.set(CACHE, x[1]);
    }).catch(function (err) {
      $('updated').textContent = /blocked|Access|permission|sign/i.test(String(err && err.message)) ? 'The B2B Website Visits sheet is not shared "Anyone with the link: Viewer".' : 'Could not load. Check the internet connection.';
    });
  }
  function showGate(msg) {
    $('app').hidden = true; $('gate').hidden = false; $('gmsg').textContent = msg || '';
    var g = window.google && google.accounts && google.accounts.id; if (!g) return setTimeout(function () { showGate(msg); }, 300);
    g.initialize({ client_id: CID, auto_select: false, itp_support: true, use_fedcm_for_prompt: true, callback: function (r) {
      var t; try { t = JSON.parse(decodeURIComponent(escape(atob(r.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { $('gmsg').textContent = 'Sign-in did not finish. Try again.'; return; }
      var e = String(t.email || '').toLowerCase(); $('gmsg').textContent = 'Checking…';
      admins().then(function (m) {
        if (!m[e]) { $('gmsg').textContent = e + ' is not on the Admin list.'; return; }
        store.set(USER, { e: e, n: m[e].n || t.name || '', p: t.picture || '' }); $('gmsg').textContent = 'Loading…'; load();
      }, function () { $('gmsg').textContent = 'Could not check the Admin list. Check the internet connection.'; });
    } });
    $('gbtn').innerHTML = ''; g.renderButton($('gbtn'), { theme: 'outline', size: 'large', shape: 'pill', text: 'continue_with', width: 300 }); g.prompt();
  }
  setTimeout(function start() {   // after the whole script has run (render() needs the helpers defined further down)
    var me = store.get(USER), cache = store.get(CACHE);
    if (!me) return showGate();
    if (cache && cache.admin === me.e) show(cache, true);   // instant: the last copy
    load(true);
  }, 0);
  setInterval(function () { if (store.get(USER) && !document.hidden) load(true); }, 60000);   // live refresh while open
  window.__chartReady = function () { if (S.data && S.tab === 'overview') render(); };   // the chart library loads in the background
  $('signout').addEventListener('click', function () {
    store.del(USER); store.del(CACHE); S.data = null;
    try { google.accounts.id.disableAutoSelect(); } catch (e) {}
    showGate('Signed out.');
  });

  // ------------------------------------------------------------- slicing
  function cut() {
    var d = S.data, me = S.hideMe ? d.admin : null, start = new Date(dkey(Date.now() - (S.days - 1) * DAY) + 'T00:00:00+06:00').getTime();
    var prevStart = start - S.days * DAY;
    var ok = function (r) { return r[1] !== me; };
    var all = { visits: d.visits.filter(ok), pages: d.pages.filter(ok), vr: d.vr.filter(ok), events: d.events.filter(ok) };
    var inR = function (a) { return a.filter(function (r) { return r[0] >= start; }); };
    var inP = function (a) { return a.filter(function (r) { return r[0] >= prevStart && r[0] < start; }); };
    return { start: start, all: all, visits: inR(all.visits), pages: inR(all.pages), vr: inR(all.vr), events: inR(all.events),
      prev: { visits: inP(all.visits), pages: inP(all.pages) } };
  }
  var name = function (e) { var p = S.data.people[e]; return p && p.n ? p.n : e; };
  var person = function (e) { return S.data.people[e] || { n: e, r: '', team: '' }; };
  function count(arr, f) { var m = {}; arr.forEach(function (r) { var k = f(r); if (k == null || k === '') return; m[k] = (m[k] || 0) + 1; }); return m; }
  function top(m, n) { return Object.keys(m).map(function (k) { return [k, m[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, n || 10); }
  function bars(list, unit) {
    if (!list.length) return '<div class="empty">No data in this period</div>';
    var max = list[0][1] || 1;
    return '<div class="bars">' + list.map(function (x) {
      return '<div class="bar"><span class="n" title="' + esc(x[0]) + '">' + esc(x[0]) + '</span><span class="c">' + (x[2] || fmtN(x[1])) + (unit || '') + '</span><span class="t"><i style="width:' + Math.max(2, x[1] / max * 100) + '%"></i></span></div>';
    }).join('') + '</div>';
  }
  function kpi(l, v, prev, now, sub) {
    var d = '';
    if (prev != null) { var p = prev ? Math.round((now - prev) / prev * 100) : null; d = p == null ? (now ? 'new' : '') : (p >= 0 ? '<span class="up">▲ ' + p + '%</span>' : '<span class="down">▼ ' + -p + '%</span>') + ' vs previous ' + (S.days === 1 ? 'day' : S.days + ' days'); }
    return '<div class="card kpi"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="d">' + (sub || d) + '</div></div>';
  }
  function statusOf(e) {
    var vs = S.data.visits.filter(function (r) { return r[1] === e; });
    if (!vs.length) return ['Never', 'Never opened', null];
    var last = Math.max.apply(null, vs.map(function (r) { return r[0]; })), dd = (Date.now() - last) / DAY;
    return dd <= 3 ? ['Active', 'Active', last] : dd <= 7 ? ['Slowing', 'Slowing down', last] : ['Stopped', 'Stopped', last];
  }

  // ------------------------------------------------------------- views
  function render() {

    var probs = c.events.filter(function (r) { return r[2] === 'rage' || r[2] === 'error'; }).sort(function (a, b) { return b[0] - a[0]; }).slice(0, 50);
    var areas = top(count(c.events.filter(function (r) { return r[2] === 'click' && /^Area: /.test(r[4]); }), function (r) { return r[4].slice(6) + ' (' + r[3] + ')'; }), 15);
    return '<div class="grid g3"><div class="card"><h2>Devices</h2><p class="sub">Visits</p>' + bars(dev) + '</div><div class="card"><h2>Systems</h2><p class="sub">Visits</p>' + bars(os) + '</div><div class="card"><h2>Browsers</h2><p class="sub">Visits</p>' + bars(br) + '</div></div>' +
      '<div class="card" style="margin-top:16px"><h2>Clicks on things that are not buttons</h2><p class="sub">Where people click or tap expecting something to happen (charts, icons, figures). Many clicks on one area can mean people want it to be clickable.</p>' + bars(areas) + '</div>' +
      '<div class="card" style="margin-top:16px"><h2>Problems</h2><p class="sub">Rage clicks (the same spot tapped 3+ times in a second: something did not respond) and page errors</p>' +
      (probs.length ? '<div class="scroll"><table><tr><th>When</th><th>Who</th><th>Type</th><th>Page</th><th>Where / message</th></tr>' + probs.map(function (r) {
        return '<tr><td class="muted">' + when(r[0]) + '</td><td>' + esc(name(r[1])) + '</td><td>' + (r[2] === 'rage' ? 'Rage click' : 'Error') + '</td><td>' + esc(r[3]) + '</td><td>' + esc(r[4]) + '</td></tr>'; }).join('') + '</table></div>' : '<div class="empty">No problems in this period</div>') + '</div>';
  }

  // ------------------------------------------------------------- person drawer
  function openPerson(e) {
    var d = S.data, p = person(e), st = statusOf(e);
    var items = [];
    d.visits.forEach(function (r) { if (r[1] === e) items.push([r[0], 'open', 'Opened the site on ' + esc(r[2]) + ' · ' + esc(r[3]) + ' · ' + esc(r[4])]); });
    d.pages.forEach(function (r) { if (r[1] === e) items.push([r[0], 'pg', esc(r[2]) + (r[4] ? ' · <span class="muted">' + dur(r[4]) + (r[5] ? ', scrolled ' + r[5] + '%' : '') + '</span>' : '')]); });
    d.vr.forEach(function (r) { if (r[1] === e) items.push([r[0], 'vr', 'Visit Report · ' + esc(r[2]) + (r[3] ? ' · ' + esc(fmtMonth(r[3])) : '') + ' · <b>' + esc(r[4] || 'all salespeople') + '</b>' + (r[5] ? ' · feedback of ' + esc(fmtDay(r[5])) : '') + ' <span class="muted">' + dur(r[7]) + '</span>']); });
    d.events.forEach(function (r) { if (r[1] === e && r[2] === 'click') items.push([r[0], 'ev', 'Clicked <b>' + esc(/^Area: /.test(r[4]) ? r[4].slice(6) + ' (not a button)' : r[4]) + '</b> <span class="muted">on ' + esc(r[3]) + '</span>']); });
    d.events.forEach(function (r) { if (r[1] === e && r[2] !== 'click') items.push([r[0], r[2] === 'detail' ? 'vr' : 'ev',
      r[2] === 'search' ? 'Searched “' + esc(r[5]) + '” on ' + esc(r[3]) : r[2] === 'detail' ? 'Opened <b>' + esc(r[4]) + '</b> on ' + esc(r[3]) + ' <span class="muted">' + dur(+r[8] || 0) + '</span>'
      : r[2] === 'rage' ? 'Rage click on ' + esc(r[4]) : 'Error: ' + esc(r[4])]); });
    items.sort(function (a, b) { return b[0] - a[0]; });
    var clicks = top(count(d.events.filter(function (r) { return r[1] === e && r[2] === 'click' && !/^Area: /.test(r[4]); }), function (r) { return r[4]; }), 8);
    var h = '<p class="muted" style="margin-top:0">' + esc(e) + ' · ' + esc(p.r) + ' · <span class="pill p-' + st[0] + '">' + st[1] + '</span></p>';
    h += '<h3 style="margin:16px 0 8px">Clicks most</h3>' + bars(clicks) + '<h3 style="margin:20px 0 8px">Timeline</h3>';
    if (!items.length) h += '<div class="empty">No activity yet</div>';
    else { var lastDay = ''; h += '<div class="tl">' + items.slice(0, 400).map(function (x) {
      var dk = dkey(x[0]), s = ''; if (dk !== lastDay) { lastDay = dk; s += '<div class="it day">' + dfmt(x[0], { weekday: 'long', day: 'numeric', month: 'long' }) + '</div>'; }
      return s + '<div class="it ' + (x[1] === 'vr' ? 'vr' : '') + '"><span class="muted">' + dfmt(x[0], { hour: 'numeric', minute: '2-digit', hour12: true }) + '</span> · ' + x[2] + '</div>';
    }).join('') + '</div>'; }
    $('dname').textContent = p.n || e; $('dbody').innerHTML = h;
    $('drawer').classList.add('on'); $('drawer').setAttribute('aria-hidden', 'false'); $('scrim').classList.add('on');
  }
  function closePerson() { $('drawer').classList.remove('on'); $('drawer').setAttribute('aria-hidden', 'true'); $('scrim').classList.remove('on'); }
  $('dclose').addEventListener('click', closePerson); $('scrim').addEventListener('click', closePerson);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePerson(); });

  // ------------------------------------------------------------- controls
  $('range').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.days = +b.getAttribute('data-d'); [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); }); render(); });
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.tab = b.getAttribute('data-t'); [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); }); render(); });
  $('hideMe').addEventListener('change', function () { S.hideMe = this.checked; render(); });
})();
</script>
</body>
