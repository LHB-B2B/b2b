function buildSoFilter(data, st){
  var sos = uniqueSos(data, st.month);
  var sel = document.getElementById('sofilter');
  sel.innerHTML = '<option value="">All salespeople</option>' +
    sos.map(function(s){ return '<option'+(s===st.soFilter?' selected':'')+'>'+esc(s)+'</option>'; }).join('');
  sel.onchange = function(){
    st.soFilter = this.value;
    window.scrollTo({ top:0, behavior:'smooth' });
    paint(data, st);
  };
}

function uniqueSos(data, month){
  var m = {};
  data.visits.forEach(function(v){ if (v.d.substring(0,7)===month) m[v.s]=1; });
  return Object.keys(m).sort();
}

function rowsFor(data, st){
  return data.visits.filter(function(v){
    return v.d.substring(0,7)===st.month && (!st.soFilter || v.s===st.soFilter);
  });
}

/* ─────────── tiles + heatmaps + tables ─────────── */
/* ─────────── working days: Fridays, holidays, leave ───────────
   A person's "working days" in a month are the calendar days minus
   Fridays, minus government holidays, minus his own leave — and for
   the running month, only the days that have already happened.     */
var CURDATA = null;

function ensureDays(data){
  if (data._hol) return;
  var hol = {};
  var H = data.holidays;
  if (H && typeof H.length === 'number') {          // old cached shape: plain list
    H.forEach(function(d){ hol[d] = 'Government holiday'; });
  } else if (H) {                                    // { "2026-08-05": "Victory Day", ... }
    Object.keys(H).forEach(function(d){ hol[d] = H[d] || 'Government holiday'; });
  }
  data._hol = hol;
  var lv = {};
  (data.leaves || []).forEach(function(r){ (lv[r.s] = lv[r.s] || {})[r.d] = 1; });
  data._leave = lv;
  var vk = {}, dh = {};
  data.visits.forEach(function(v){ vk[v.s + '|' + v.d] = 1; dh[v.d] = 1; });
  data._vk = vk;
  data._dayHas = dh;
}

function isFriday(iso){
  return new Date(+iso.substring(0,4), +iso.substring(5,7)-1, +iso.substring(8,10)).getDay() === 5;
}
function isoToday(){
  var t = new Date();
  return t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2);
}
function nextIso(iso){
  var d = new Date(+iso.substring(0,4), +iso.substring(5,7)-1, +iso.substring(8,10));
  d.setDate(d.getDate()+1);
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
/* Days of the month that have actually happened. */
function monthDays(month){
  var y = +month.substring(0,4), m = +month.substring(5,7)-1;
  var n = new Date(y, m+1, 0).getDate(), today = isoToday(), out = [];
  for (var d=1; d<=n; d++){
    var iso = month + '-' + (d<10?'0':'') + d;
    if (iso > today) break;
    out.push(iso);
  }
  return out;
}
function hasVisit(data, person, iso){
  ensureDays(data);
  return !!data._vk[person + '|' + iso];
}
/* person = '' → Fridays and holidays only, nobody's leave. */
function workingDays(data, month, person){
  ensureDays(data);
  var lv = (person && data._leave[person]) || {};
  var today = isoToday();
  var out = [];
  monthDays(month).forEach(function(iso){
    if (isFriday(iso)) return;
    if (data._hol[iso]) return;
    if (lv[iso] && !hasVisit(data, person, iso)) return;   // visits beat a leave claim
    /* Reports arrive in the evening, so TODAY only becomes a working day
       once it has been reported: for one person, when he has submitted;
       for the team calendar, when anyone in the team has.               */
    if (iso === today) {
      if (person ? !hasVisit(data, person, iso) : !data._dayHas[iso]) return;
    }
    out.push(iso);
  });
  return out;
}
/* Working days strictly between two dates — used for the reporting delay. */
function workingGap(data, person, fromIso, toIso){
  if (!toIso || toIso <= fromIso) return 0;
  ensureDays(data);
  var lv = (person && data._leave[person]) || {};
  var cur = fromIso, n = 0, guard = 0;
  while (cur < toIso && guard++ < 400){
    cur = nextIso(cur);
    if (isFriday(cur) || data._hol[cur] || lv[cur]) continue;
    n++;
  }
  return n;
}
function leaveDaysIn(data, month, person){
  ensureDays(data);
  var count = function(p){
    var n = 0, days = data._leave[p] || {};
    Object.keys(days).forEach(function(iso){
      if (iso.substring(0,7) === month && iso <= isoToday() && !isFriday(iso) &&
          !data._hol[iso] && !hasVisit(data, p, iso)) n++;
    });
    return n;
  };
  if (person) return count(person);
  var total = 0;
  Object.keys(data._leave).forEach(function(p){ total += count(p); });
  return total;
}
function holidaysIn(data, month){
  ensureDays(data);
  var n = 0;
  monthDays(month).forEach(function(iso){ if (!isFriday(iso) && data._hol[iso]) n++; });
  return n;
}
function fridaysIn(month){
  var n = 0;
  monthDays(month).forEach(function(iso){ if (isFriday(iso)) n++; });
  return n;
}
/* Everyone who either visited or claimed leave in this month. */
function peopleIn(data, month){
  ensureDays(data);
  var m = {};
  data.visits.forEach(function(v){ if (v.d.substring(0,7) === month) m[v.s] = 1; });
  Object.keys(data._leave).forEach(function(p){
    Object.keys(data._leave[p]).forEach(function(iso){
      if (iso.substring(0,7) === month) m[p] = 1;
    });
  });
  return Object.keys(m).sort();
}

function paint(data, st){
  CURDATA = data;
  ensureDays(data);
  var canon = data._canon || ensureClusters(data);
  var rows = rowsFor(data, st);
  var days={}, sos={};
  rows.forEach(function(v){
    days[v.d]=(days[v.d]||0)+1;
    (sos[v.s]=sos[v.s]||{n:0,d:{},c:{},lagN:0,lagSum:0,lagSame:0});
    sos[v.s].n++; sos[v.s].d[v.d]=(sos[v.s].d[v.d]||0)+1;
    sos[v.s].c[canon[v.c] || v.c] = 1;   // dedupe by fuzzy-matched customer, not raw spelling
    var g = lagOf(v);
    if (g !== null){ sos[v.s].lagN++; sos[v.s].lagSum += g; if (g === 0) sos[v.s].lagSame++; }
  });
  var activeDays = Object.keys(days).length;
  var soNames = st.soFilter ? [st.soFilter] : peopleIn(data, st.month);
  soNames.forEach(function(n){ if (!sos[n]) sos[n] = {n:0,d:{},c:{},lagN:0,lagSum:0,lagSame:0}; });
  soNames.sort();
  var lag = lagStats(rows);

  /* expected working days: one person, or the team as man-days */
  var manDays = 0;
  soNames.forEach(function(p){ manDays += workingDays(data, st.month, p).length; });
  var calWork   = workingDays(data, st.month, '').length;
  var leaveDays = leaveDaysIn(data, st.month, st.soFilter || '');

  document.getElementById('tiles').innerHTML =
    '<div class="tiles">'+
      tile(0, 'Total visits', rows.length, 0, '', monthLabel(st.month)) +
      tile(1, 'Avg per working day', manDays ? rows.length/manDays : 0, 1, '',
           st.soFilter ? 'visits per working day'
                       : 'visits per person per working day') +
      tile(2, 'Avg reporting delay', lag.n ? lag.avg : null, 1, ' d',
           lag.n ? 'working days, visit \u2192 entry (' + lag.n + ' of ' + rows.length + ' tracked)'
                 : 'no submission times recorded yet') +
      tile(3, 'Same-day reporting', lag.n ? lag.same*100/lag.n : null, 0, '%',
           lag.n ? 'entered on the visit date itself'
                 : 'add a \u201cSubmitted At\u201d column to track this') +
    '</div>'+
    '<div class="daystrip">'+
      '<span><b>'+(st.soFilter ? manDays : calWork)+'</b> working days</span>'+
      '<span><b>'+activeDays+'</b> active days</span>'+
      '<span><b>'+leaveDays+'</b> leave</span>'+
      '<span><b>'+holidaysIn(data, st.month)+'</b> holidays</span>'+
      '<span><b>'+fridaysIn(st.month)+'</b> Fridays</span>'+
    '</div>';
  countUp();

  /* heatmaps */
  var grid = document.getElementById('sogrid');
  grid.innerHTML = '';
  soNames.forEach(function(name, i){
    var c = calendar(name, sos[name], st, data);
    c.style.animationDelay = (i*80) + 'ms';
    grid.appendChild(c);
  });
  if (!soNames.length) grid.innerHTML = '<div class="empty">No visits recorded this month.</div>';

  /* SO table */
  var soMax = Math.max.apply(null, soNames.map(function(n){ return sos[n].n; }).concat([1]));
  document.getElementById('sotable').innerHTML =
    '<div class="table-scroll wide"><table><thead><tr><th>Salesperson</th><th class="num">Visits</th>'+
    '<th class="num">Customers</th><th class="num">Working days</th><th class="num">Active days</th>'+
    '<th class="num">Avg per working day</th>'+
    '<th class="num">Avg delay</th><th class="num">Same-day reporting</th></tr></thead><tbody>' +
    soNames.map(function(n){
      var s  = sos[n];
      var ad = Object.keys(s.d).length;
      var wd = workingDays(data, st.month, n).length;
      return '<tr><td>'+esc(n)+'<i class="vbar"><b style="width:'+(s.n*100/soMax).toFixed(1)+'%"></b></i></td><td class="num">'+s.n+'</td><td class="num">'+
        Object.keys(s.c).length+'</td><td class="num">'+wd+'</td><td class="num">'+ad+'</td><td class="num">'+
        (wd?(s.n/wd).toFixed(1):'0')+'</td><td class="num">'+
        (s.lagN ? (s.lagSum/s.lagN).toFixed(1)+' d' : '\u2014')+'</td><td class="num">'+
        (s.lagN ? Math.round(s.lagSame*100/s.lagN)+'%' : '\u2014')+'</td></tr>';
    }).join('') + '</tbody></table></div>' +
    /* phones: one row per person, full-width visits bar, small figures under it */
    '<div class="so-list">' + soNames.map(function(n){
      var s = sos[n], wd = workingDays(data, st.month, n).length;
      return '<div class="sl-row"><div class="sl-top"><span class="sl-name">'+esc(n)+'</span>'+
        '<span class="sl-n">'+s.n+' <small>visits</small></span></div>'+
        '<div class="sl-bar"><b style="width:'+(s.n*100/soMax).toFixed(1)+'%"></b></div>'+
        '<div class="sl-figs"><span><b>'+Object.keys(s.c).length+'</b> customers</span>'+
        '<span><b>'+(wd?(s.n/wd).toFixed(1):'0')+'</b> per working day</span>'+
        '<span><b>'+Object.keys(s.d).length+'/'+wd+'</b> days</span>'+
        '<span>delay <b>'+(s.lagN ? (s.lagSum/s.lagN).toFixed(1)+' d' : '\u2014')+'</b></span>'+
        '<span>same day <b>'+(s.lagN ? Math.round(s.lagSame*100/s.lagN)+'%' : '\u2014')+'</b></span></div></div>';
    }).join('') + '</div>';

  /* customer table — driven by fuzzy-matched canonical names */
  paintCustomerTable(data, st);
}

function tile(i, k, val, dec, suffix, s){
  var shown = (val === null)
    ? '—'
    : '<span class="cnt" data-to="'+val+'" data-dec="'+dec+'" data-sfx="'+esc(suffix)+'">0'+
      (dec ? '.'+Array(dec+1).join('0') : '')+esc(suffix)+'</span>';
  return '<div class="tile" style="animation-delay:'+(i*70)+'ms">'+
           '<div class="k">'+k+'</div><div class="v">'+shown+'</div>'+
           '<div class="s">'+s+'</div></div>';
}

/* numbers roll up to their value on render */
function countUp(){
  [].forEach.call(document.querySelectorAll('.cnt'), function(el, i){
    var to  = parseFloat(el.getAttribute('data-to')) || 0;
    var dec = parseInt(el.getAttribute('data-dec'), 10) || 0;
    var sfx = el.getAttribute('data-sfx') || '';
    var dur = 900, start = null, delay = 140 + i*70;
    function step(ts){
      if (start === null) start = ts;
      var t = (ts - start - delay) / dur;
      if (t < 0) { requestAnimationFrame(step); return; }
      if (t > 1) t = 1;
      var e = 1 - Math.pow(1 - t, 3);              // ease-out cubic
      el.textContent = (to*e).toFixed(dec) + sfx;
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function calendar(name, so, st, data){
  var y = +st.month.substring(0,4), m = +st.month.substring(5,7)-1;
  var first = new Date(y, m, 1).getDay();          // 0 = Sunday
  var ndays = new Date(y, m+1, 0).getDate();

  var box = document.createElement('div');
  box.className = 'so';
  box.innerHTML =
    '<div class="so-head"><span class="so-name">'+esc(name)+'</span>'+
    '<span class="so-sub">'+so.n+' visits · '+Object.keys(so.d).length+'/'+workingDays(data, st.month, name).length+' days</span></div>'+
    '<div class="dow">'+DOW.map(function(d){return '<span>'+d+'</span>';}).join('')+'</div>';

  var cal = document.createElement('div');
  cal.className = 'cal';
  for (var b=0;b<first;b++){
    var blank=document.createElement('div'); blank.className='cell blank'; cal.appendChild(blank);
  }
  for (var d=1; d<=ndays; d++){
    var iso = st.month + '-' + (d<10?'0':'') + d;
    var n = so.d[iso] || 0;
    var wd = new Date(y,m,d).getDay();
    var offFri = (wd === 5);
    var offHol = (data._hol && data._hol[iso]) || '';
    var offLv  = !n && !!(data._leave && data._leave[name] && data._leave[name][iso]);
    var cell = document.createElement('div');
    cell.className = 'cell ' + lvl(n) + (n?' has':'') +
      (n ? '' : (offHol ? ' holiday' : (offFri ? ' friday' : (offLv ? ' leave' : ''))));
    cell.textContent = d;
    cell.style.animationDelay = (180 + d*12) + 'ms';

    (function(iso, name, n, offHol, offFri, offLv){
      var what = n        ? (n + ' visit' + (n===1?'':'s') + ' — click to read')
               : offHol   ? offHol
               : offFri   ? 'Friday — weekly off'
               : offLv    ? 'Leave'
               :            'No visit reported';
      var label = fmtDate(iso) + ' · ' + what;
      cell.onmouseenter = function(e){ showTip(label, e); };
      cell.onmousemove  = function(e){ moveTip(e); };
      cell.onmouseleave = hideTip;
      if (n) cell.onclick = function(){ hideTip(); pushDrawerHistory(); openDay(data, st, name, iso, this); };
    })(iso, name, n, offHol, offFri, offLv);

    cal.appendChild(cell);
  }
  box.appendChild(cal);

  /* phones: a strip of the month's days; tapping the name opens the full calendar */
  var strip = document.createElement('div');
  strip.className = 'so-strip';
  strip.style.gridTemplateColumns = 'repeat(' + ndays + ',minmax(0,1fr))';
  for (var k=1; k<=ndays; k++){
    var iso2 = st.month + '-' + (k<10?'0':'') + k, n2 = so.d[iso2] || 0;
    var off = n2 ? '' : (data._hol && data._hol[iso2]) ? ' holiday' : new Date(y,m,k).getDay() === 5 ? ' friday'
            : (data._leave && data._leave[name] && data._leave[name][iso2]) ? ' leave' : '';
    strip.insertAdjacentHTML('beforeend', '<i class="' + lvl(n2) + off + '"></i>');
  }
  box.insertBefore(strip, box.querySelector('.dow'));
  var tog = document.createElement('button');
  tog.type = 'button';
  tog.className = 'so-tog';
  tog.setAttribute('aria-expanded', 'false');
  tog.textContent = 'Show calendar \u25BE';
  box.appendChild(tog);
  box.querySelector('.so-head').onclick = tog.onclick = function(){
    var open = box.classList.toggle('open');
    tog.setAttribute('aria-expanded', open ? 'true' : 'false');
    tog.textContent = open ? 'Hide calendar \u25B4' : 'Show calendar \u25BE';
  };
  return box;
}

function lvl(n){ return n===0?'':(n===1?'l1':n===2?'l2':n===3?'l3':n===4?'l4':'l5'); }

/* ─────────── Most Visited Customers table ───────────
   Groups this month's (optionally SO-filtered) rows by the fuzzy
   canonical customer name, shows EVERY customer with more than one
   visit (no top-N cap), and supports a quick text filter. Clicking
   a row opens that customer's full visit-history timeline.        */
function paintCustomerTable(data, st){
  var host = document.getElementById('custtable');
  if (!host) return;
  var canon = data._canon || ensureClusters(data);
  var rows = rowsFor(data, st);

  var groups = {};
  rows.forEach(function(v){
    var name = canon[v.c] || v.c;
    (groups[name] = groups[name] || { n:0, rawSet:{} });
    groups[name].n++;
    groups[name].rawSet[v.c] = 1;
  });

  var list = Object.keys(groups)
    .map(function(name){ return { name:name, n:groups[name].n, raws:Object.keys(groups[name].rawSet) }; })
    .filter(function(x){ return x.n > 1; });

  var q = (st.custQuery||'').trim().toLowerCase();
  if (q) list = list.filter(function(x){ return x.name.toLowerCase().indexOf(q) !== -1; });

  list.sort(function(a,b){ return b.n-a.n || a.name.localeCompare(b.name); });
  var custMax = list.length ? list[0].n : 1;

  if (!list.length){
    host.innerHTML = '<div class="empty">'+
      (q ? 'No customer matches “'+esc(st.custQuery)+'”.' : 'No repeat customers this month yet.')+
      '</div>';
    return;
  }

  host.innerHTML =
    '<div class="table-scroll"><table><thead><tr><th>Customer</th><th class="num">Visits</th><th></th></tr></thead><tbody>'+
    list.map(function(x, i){
      var others = x.raws.filter(function(r){ return r!==x.name; });
      // footnote-style marker, not a highlighted badge - hover (or tap) to
      // see which other spellings were folded into this row.
      var noteHtml = others.length
        ? '<sup class="aka-note" data-variants="'+encodeURIComponent(others.join(' · '))+'" title="">'+others.length+'</sup>'
        : '';
      return '<tr class="cust-row" data-cust="'+encodeURIComponent(x.name)+'" style="animation-delay:'+(Math.min(i,14)*0.04)+'s">'+
        '<td><span class="cust-name">'+esc(x.name)+'</span>'+noteHtml+'<i class="vbar"><b style="width:'+(x.n*100/custMax).toFixed(1)+'%"></b></i></td>'+
        '<td class="num">'+x.n+'</td>'+
        '<td class="go">Timeline →</td>'+
      '</tr>';
    }).join('') + '</tbody></table></div>';

  [].forEach.call(host.querySelectorAll('.cust-row'), function(tr){
    tr.onclick = function(){
      pushDrawerHistory();
      openCustomerTimeline(data, decodeURIComponent(tr.getAttribute('data-cust')));
    };
  });

  [].forEach.call(host.querySelectorAll('.aka-note'), function(sup){
    var label = 'Also recorded as: ' + decodeURIComponent(sup.getAttribute('data-variants'));
    sup.onmouseenter = function(e){ showTip(label, e); };
    sup.onmousemove = function(e){ moveTip(e); };
    sup.onmouseleave = hideTip;
  });
}

/* ─────────── right side panel: one day's feedback ───────────
   The feedback text already travelled down with the overview
   (see f/t in getTeamOverview), so this needs zero network calls —
   the panel is built and shown in the same tick as the click.    */
function openDay(data, st, so, iso, cellEl){
  st.day = iso; st.so = so;
  [].forEach.call(document.querySelectorAll('.cell.sel'), function(c){ c.classList.remove('sel'); });
  if (cellEl) cellEl.classList.add('sel');

  var canon = data._canon || ensureClusters(data);
  var list = data.visits.filter(function(v){ return v.d===iso && v.s===so; });

  document.getElementById('dw-title').textContent = so;
  document.getElementById('dw-sub').textContent =
    fmtDate(iso) + ' · ' + list.length + ' visit' + (list.length===1?'':'s');
  document.getElementById('dw-aka').textContent = '';

  document.getElementById('dw-body').innerHTML = list.map(function(v, i){
    var g = lagOf(v);
    var canonName = canon[v.c] || v.c;
    return '<div class="fb" style="animation-delay:'+(50 + i*70)+'ms">'+
      '<div class="fb-cust-link" data-canon="'+encodeURIComponent(canonName)+'" '+
        'data-so="'+encodeURIComponent(so)+'" data-iso="'+encodeURIComponent(iso)+'" '+
        'title="See this customer\u2019s full visit timeline">'+
        '<h4>'+esc(v.c)+'</h4>'+
        '<span class="fb-hint">Click to view timeline</span>'+
      '</div>'+
      '<div class="meta">'+
        (v.t ? 'Submitted '+esc(v.t) : 'Submission time not recorded')+
        (g===null ? '' : ' <span class="lag '+lagClass(g)+'">'+lagText(g)+'</span>')+
      '</div>'+
      '<div class="txt">'+
        (v.f ? esc(v.f) : '<span style="color:var(--muted)">No feedback text recorded.</span>')+
      '</div></div>';
  }).join('') || '<div class="empty">Nothing to show.</div>';

  [].forEach.call(document.querySelectorAll('.fb-cust-link'), function(wrap){
    wrap.onclick = function(){
      openCustomerTimeline(data, decodeURIComponent(wrap.getAttribute('data-canon')), {
        so: decodeURIComponent(wrap.getAttribute('data-so')),
        iso: decodeURIComponent(wrap.getAttribute('data-iso'))
      });
    };
  });

  showDrawer();
}

/* ─────────── right side panel: customer timeline ───────────
   Full visit history for a customer (across ALL months, ALL
   salespeople) grouped by the fuzzy-matched canonical name —
   the "beautiful visual timeline" from the click-through.        */
/* A customer's timeline shows their WHOLE history, so any older months
   not yet in the browser are fetched first (a short wait, once).   */
function openCustomerTimeline(data, canonName, backCtx){
  if (!needMonths(data, data.months || []).length)
    return openCustomerTimelineNow(data, canonName, backCtx);
  document.getElementById('dw-title').textContent = canonName;
  document.getElementById('dw-sub').textContent = 'Loading full visit history…';
  document.getElementById('dw-aka').textContent = '';
  document.getElementById('dw-body').innerHTML =
    '<div class="loading"><div class="spin"></div>Loading older months…</div>';
  showDrawer();
  ensureMonths(data, data.months).then(function(){
    var canon = ensureClusters(data);
    openCustomerTimelineNow(data, canon[canonName] || canonName, backCtx);
  }).catch(function(e){
    document.getElementById('dw-body').innerHTML =
      '<div class="err">Could not load older months.<br>' + esc(e && e.message || e) + '</div>';
  });
}

function openCustomerTimelineNow(data, canonName, backCtx){
  [].forEach.call(document.querySelectorAll('.cell.sel'), function(c){ c.classList.remove('sel'); });

  var canon = data._canon || ensureClusters(data);
  var variants = (data._variants && data._variants[canonName]) || [canonName];
  var variantSet = {};
  variants.forEach(function(v){ variantSet[v] = 1; });

  var visits = data.visits
    .filter(function(v){ return variantSet[v.c]; })
    .slice()
    .sort(function(a,b){ return a.d < b.d ? -1 : (a.d > b.d ? 1 : 0); });

  var soSet = {};
  visits.forEach(function(v){ soSet[v.s] = (soSet[v.s]||0)+1; });
  var soNames = Object.keys(soSet);
  var first = visits[0], last = visits[visits.length-1];

  document.getElementById('dw-title').textContent = canonName;
  document.getElementById('dw-sub').textContent =
    visits.length + ' visit' + (visits.length===1?'':'s') + ' recorded' +
    (first && last ? ' · ' + fmtDate(first.d) + (first.d!==last.d ? ' → ' + fmtDate(last.d) : '') : '');
  document.getElementById('dw-aka').textContent =
    variants.length > 1 ? 'Also recorded as: ' + variants.filter(function(v){return v!==canonName;}).join(' · ') : '';

  var backHtml = backCtx
    ? '<button class="tl-back" id="tl-back-btn">\u2190 Back to '+esc(fmtDate(backCtx.iso))+' \u00b7 '+esc(backCtx.so)+'</button>'
    : '';

  var statsHtml =
    '<div class="tl-stats">'+
      '<div class="tl-stat" style="animation-delay:.02s"><b>'+visits.length+'</b><span>Total visits</span></div>'+
      '<div class="tl-stat" style="animation-delay:.08s"><b>'+soNames.length+'</b><span>Salespeople</span></div>'+
      '<div class="tl-stat" style="animation-delay:.14s"><b>'+(visits.length>1 ? avgGapDays(visits)+'d' : '—')+'</b><span>Avg. gap</span></div>'+
    '</div>';

  function wireBack(){
    if (!backCtx) return;
    var btn = document.getElementById('tl-back-btn');
    if (btn) btn.onclick = function(){ openDay(data, state[cur], backCtx.so, backCtx.iso); };
  }

  if (!visits.length){
    document.getElementById('dw-body').innerHTML = backHtml + statsHtml + '<div class="empty">No visits recorded.</div>';
    wireBack();
    showDrawer();
    return;
  }

  var html = '<div class="tl">';
  var lastMonth = null;
  visits.forEach(function(v, i){
    var mon = v.d.substring(0,7);
    if (mon !== lastMonth){
      html += '<div class="tl-month">'+monthLabel(mon)+'</div>';
      lastMonth = mon;
    }
    var g = lagOf(v);
    var isLatest = (i === visits.length-1);
    var bodyId = 'tlfb'+i;
    var longText = v.f && v.f.length > 260;
    html +=
      '<div class="tl-item'+(isLatest?' latest':'')+'" style="animation-delay:'+(Math.min(i,18)*0.05)+'s">'+
        '<div class="tl-dot"></div>'+
        '<div class="tl-card">'+
          '<div class="tl-top"><span class="tl-date">'+fmtDate(v.d)+'</span>'+
            '<span class="tl-so">'+esc(v.s)+'</span></div>'+
          '<div class="tl-meta">'+
            (v.t ? 'Submitted '+esc(v.t) : 'Submission time not recorded')+
            (g===null ? '' : ' <span class="lag '+lagClass(g)+'">'+lagText(g)+'</span>')+
          '</div>'+
          (v.f
            ? '<div class="tl-txt'+(longText?' clip':'')+'" id="'+bodyId+'">'+esc(v.f)+'</div>'+
              (longText ? '<button class="tl-more" onclick="expandTl(\''+bodyId+'\',this)">Show full feedback</button>' : '')
            : '<div class="tl-txt" style="color:var(--muted)">No feedback text recorded.</div>')+
          (v.c !== canonName ? '<div class="tl-alias">Entered as “'+esc(v.c)+'” in the sheet</div>' : '')+
        '</div>'+
      '</div>';
  });
  html += '</div>';

  document.getElementById('dw-body').innerHTML = backHtml + statsHtml + html;
  wireBack();
  showDrawer();
}

function expandTl(id, btn){
  var el = document.getElementById(id);
  if (el) el.classList.remove('clip');
  if (btn) btn.remove();
}

function avgGapDays(visitsAsc){
  var d0 = dateUTC(visitsAsc[0].d), d1 = dateUTC(visitsAsc[visitsAsc.length-1].d);
  var span = Math.round((d1-d0)/86400000);
  return Math.round(span / (visitsAsc.length-1));
}
function dateUTC(iso){
  return Date.UTC(+iso.substring(0,4), +iso.substring(5,7)-1, +iso.substring(8,10));
}

function showDrawer(){
  document.getElementById('drawer').classList.add('on');
  document.getElementById('drawer').setAttribute('aria-hidden','false');
  document.getElementById('scrim').classList.add('on');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('drawer').setAttribute('aria-hidden','true');
  document.getElementById('scrim').classList.remove('on');
  [].forEach.call(document.querySelectorAll('.cell.sel'), function(c){ c.classList.remove('sel'); });
  if (pendingFresh) setTimeout(applyFresh, 300);
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') requestCloseDrawer(); });

/* ─────────── hover tooltip ─────────── */
function showTip(text, e){
  var t = document.getElementById('tip');
  t.textContent = text; t.classList.add('on'); moveTip(e);
}
function moveTip(e){
  var t = document.getElementById('tip');
  var x = e.clientX + 14, y = e.clientY + 18;
  if (x + t.offsetWidth + 12 > window.innerWidth) x = e.clientX - t.offsetWidth - 14;
  if (y + t.offsetHeight + 12 > window.innerHeight) y = e.clientY - t.offsetHeight - 14;
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function hideTip(){ document.getElementById('tip').classList.remove('on'); }

/* ─────────── reporting delay ─────────── */
/* Days between the visit date and the day the SO actually entered it.
   0 = same evening. Blank when the sheet has no submission time.      */
function lagOf(v){
  if (!v.a) return null;
  if (v.a <= v.d) return 0;
  /* Working days only: a Thursday visit entered on Saturday is 1 day
     late, not 2, because Friday was never a working day.            */
  if (CURDATA) return workingGap(CURDATA, v.s, v.d, v.a);
  var a = Date.UTC(+v.d.substring(0,4), +v.d.substring(5,7)-1, +v.d.substring(8,10));
  var b = Date.UTC(+v.a.substring(0,4), +v.a.substring(5,7)-1, +v.a.substring(8,10));
  var days = Math.round((b - a) / 86400000);
  return days < 0 ? 0 : days;
}
function lagStats(rows){
  var n=0, sum=0, same=0;
  rows.forEach(function(v){
    var g = lagOf(v);
    if (g === null) return;
    n++; sum += g; if (g === 0) same++;
  });
  return { n:n, avg: n ? sum/n : 0, same:same };
}
function lagClass(g){ return g===0 ? 'g' : (g<=2 ? 'w' : 'b'); }
function lagText(g){
  return g===0 ? 'Same day' : (g===1 ? '1 day late' : g + ' days late');
}

/* ─────────── utils ─────────── */
function monthLabel(m){ return MONTH_NAMES[+m.substring(5,7)-1] + ' ' + m.substring(0,4); }
function fmtDate(iso){
  var p = iso.split('-');
  return (+p[2]) + ' ' + MONTH_NAMES[+p[1]-1].substring(0,3) + ' ' + p[0];
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
</script>
<script>
/* 8. Scroll reveal (see CSS part 8), same rhythm as the B2B site: 80 ms between blocks, contents follow 12px, animations inside replay */
(function(){
  var main = document.getElementById('main');
  if (!main || !('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var io = new IntersectionObserver(function(es){
    var n = 0;
    es.forEach(function(e){
      if (!e.isIntersecting) return;
      var el = e.target, d = n++ * 80;
      io.unobserve(el);
      el.style.transitionDelay = d + 'ms';
      el.classList.add('rv-in');
      if (el.getAnimations) el.getAnimations({subtree:true}).forEach(function(a){ try { a.currentTime = 0; a.play(); } catch (x) {} });
      [].forEach.call(el.children, function(c, k){
        if (c.animate) c.animate([{opacity:0, transform:'translateY(12px)'}, {opacity:1, transform:'none'}],
          {duration:500, delay:d + 120 + k*60, easing:'cubic-bezier(.25,.46,.45,.94)', fill:'backwards'});
      });
    });
  }, {rootMargin:'0px 0px -8% 0px'});
  new MutationObserver(function(){   // runs before the new content is painted, so nothing flashes
    var fold = innerHeight * 0.9;
    main.querySelectorAll('.card:not([data-rv]), .tiles:not([data-rv]), .daystrip:not([data-rv])').forEach(function(el){
      el.dataset.rv = 1;
      if (el.getBoundingClientRect().top <= fold) return;
      el.classList.add('rv');
      io.observe(el);
    });
  }).observe(main, {childList:true, subtree:true});
})();
</script>
